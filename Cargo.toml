[package]
name = "innards"
version = "0.1.1"
edition = "2024"
description = "Inline terminal tools for Rust symbol navigation, editing, and paging"
license = "GPL-3.0-only"
repository = "https://github.com/rdaum/innards"
homepage = "https://github.com/rdaum/innards"
readme = "README.md"
keywords = ["tui", "lsp", "rust-analyzer", "editor", "terminal"]
categories = ["command-line-utilities", "development-tools"]
exclude = ["*.gif"]

[dependencies]
anyhow = "1.0.102"
clap = { version = "4.5.51", features = ["derive"] }
crossterm = "0.29.0"
ratatui = "0.30.0"
ropey = "1.6.1"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
syntect = "5.3.0"
tui-spinner = "0.2.3"
tui-input = "0.15.3"
toml = "0.9.8"
url = "2.5.7"

[package.metadata.deb]
name = "innards"
maintainer = "Ryan Daum <ryan.daum@gmail.com>"
copyright = "2026, Ryan Daum"
license-file = ["LICENSE", "0"]
extended-description = """
Innards is a set of inline terminal tools for moving through source code
without losing shell context. It includes navsplat, a rust-analyzer-backed
symbol picker; inmacs, a small inline editor; and inpage, a read-only inline
pager. It also includes inbase, an inline Git interactive rebase sequence
editor.
"""
section = "utils"
priority = "optional"
depends = "$auto"
assets = [
    ["target/release/navsplat", "usr/bin/navsplat", "755"],
    ["target/release/inmacs", "usr/bin/inmacs", "755"],
    ["target/release/inpage", "usr/bin/inpage", "755"],
    ["target/release/inbase", "usr/bin/inbase", "755"],
    ["README.md", "usr/share/doc/innards/README.md", "644"],
    ["LICENSE", "usr/share/doc/innards/LICENSE", "644"],
]
