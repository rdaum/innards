[package]
name = "navsplat"
version = "0.1.0"
edition = "2024"
description = "Inline terminal tools for Rust symbol navigation, editing, and paging"
license = "GPL-3.0-only"
repository = "https://github.com/rdaum/innards"
homepage = "https://github.com/rdaum/innards"
readme = "README.md"
keywords = ["tui", "lsp", "rust-analyzer", "editor", "terminal"]
categories = ["command-line-utilities", "development-tools"]

[dependencies]
anyhow = "1.0.102"
clap = { version = "4.5.51", features = ["derive"] }
crossterm = "0.29.0"
ratatui = "0.30.0"
ropey = "1.6.1"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
syntect = "5.3.0"
tui-spinner = "0.2.3"
tui-input = "0.15.3"
toml = "0.9.8"
url = "2.5.7"
